<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://script.google.com https://script.googleusercontent.com; img-src data: https://drive.google.com https://lh3.googleusercontent.com; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>포어스바이크 차량 과태료 안내</title>
<style>
:root{color-scheme:light;background:#fff;color:#243234;font:15px/1.5 system-ui,"Malgun Gothic",sans-serif}
body{margin:0}
main{max-width:840px;margin:auto}
[hidden]{display:none!important}
img{display:block;width:100%;height:auto}
#paper{position:relative}
.notice-slice{position:relative;width:100%;aspect-ratio:var(--slice-aspect);background-image:var(--notice-image);background-repeat:no-repeat;background-size:100% var(--slice-scale);background-position:0 var(--slice-offset)}
button{font:inherit;color:#174f56;cursor:pointer}
.photo-hit{position:absolute;top:0;left:37.638889%;width:27.777778%;height:100%;display:flex;align-items:flex-end;justify-content:center;min-width:0;border:0;border-radius:3px;padding:0 0 clamp(1px,.26vw,3px);background:transparent}
.photo-label{font-size:clamp(7px,2.1vw,11px);font-weight:650;line-height:1;color:#22636a}
.photo-hit:hover{background:rgb(33 82 88 / .06)}
button:focus-visible,.photo-tools a:focus-visible{outline:2px solid #22636a;outline-offset:-2px}
.notice-status{padding:24px;text-align:center}
.notice-status button{border:1px solid #d7dfde;border-radius:4px;padding:8px 14px;background:white}
.photo-tools{position:sticky;z-index:1;top:0;padding:8px 14px;background:#fff;border-bottom:1px solid #d7dfde}
.photo-tools button{min-height:48px;border:0;border-radius:6px;padding:0 18px;background:#215258;color:#fff;font-weight:700}
.photo-tools button:hover{background:#17434a}
.photo-tools button:focus-visible{outline:2px solid #fff;outline-offset:-4px}
@media(max-width:550px){.photo-tools button{width:100%}}
a{color:#174f56;text-underline-offset:3px}
#other-photos{padding:0 18px 16px}
#other-photos li{margin:6px 0}
#other-photos button{padding:0;border:0;background:none;text-align:left;text-decoration:underline;text-underline-offset:3px}
.account-row{--vehicle-column:15.151515%;display:grid;grid-template-columns:var(--vehicle-column) minmax(0,1fr);margin:0 4.166667%}
.notice-entry:not(:last-of-type) .account-row{background:linear-gradient(to right,transparent var(--vehicle-column),#d7dfde var(--vehicle-column)) bottom/100% 1px no-repeat}
.account-row::before{content:'';background:#f0f5f3;border-right:1px solid #d7dfde}
.account-band{min-width:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:3px 10px;margin:0 1.1% 4px;padding:5px 8px;background:#efefef;color:#243234;font-size:clamp(10px,2.65vw,13px);line-height:1.5}
.account-band strong{font-weight:700;color:#474747;white-space:nowrap}
.account-band p{margin:0}
.account-band ul{flex:1 1 220px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,129px),1fr));gap:3px 10px;list-style:none;margin:0;padding:0}
.account-band li{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.account-band .account-hidden{color:#96422e}
.account-context{margin:0 0 4px;font-size:12px}
#account-fallback .account-band{margin:0 4.166667% 4px;display:block}
@media(max-width:550px){
  .photo-label{font-size:clamp(6px,1.8vw,10px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
  .account-band{font-size:clamp(6px,1.72vw,9.25px);line-height:1.45;gap:2px 5px;margin-bottom:2px;padding:3px 5px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  .account-band ul{flex-basis:150px;grid-template-columns:repeat(auto-fit,minmax(min(100%,92px),1fr));gap:1px 5px}
  .account-context{font-size:inherit}
}
</style>
</head>
<body>
<main>
  <div id="loading" class="notice-status">
    <p id="status" role="status">고지서를 불러오는 중입니다.</p>
    <button type="button" id="retry" hidden>다시 불러오기</button>
  </div>
  <section id="notice" aria-label="차량별 과태료 고지서" hidden>
    <div id="paper"><img id="png" alt="차량별 과태료 고지서"></div>
    <details id="other-photos" hidden>
      <summary>원본 사진</summary>
      <ul id="other-links"></ul>
    </details>
    <section id="account-fallback" aria-label="건별 납부계좌" hidden></section>
  </section>
  <section id="photo" aria-label="적발 사진" hidden>
    <div class="photo-tools">
      <button type="button" id="back">← 고지서로 돌아가기</button>
    </div>
    <p id="photo-status" class="notice-status" role="status"></p>
    <div id="photo-body"></div>
  </section>
</main>
<script>
'use strict';
const service = 'https://script.google.com/macros/s/AKfycbxLJFqQpij_9kWWAm-0Mwm1qEiPBcNencVLPBD3ttyvpegrQJ9nIkbdVDLhWnLtbTIn6A/exec';
const byId = id => document.getElementById(id);
const notice = byId('notice');
const paper = byId('paper');
const png = byId('png');
const photo = byId('photo');
const back = byId('back');
const photoBody = byId('photo-body');
let returnTarget;
let returnScroll = 0;

// The rider PNG was archived without a geometry sidecar. Read four narrow
// strips of its table to locate the header and row rules at any screen width.
function archivedRows(image, count) {
  const {naturalWidth: width, naturalHeight: height} = image;
  if (width !== 1440 || height < 600 || height > 20000) return null;
  const samples = [552, 565, 920, 933];
  const canvas = document.createElement('canvas');
  canvas.width = samples.length;
  canvas.height = height;
  const ctx = canvas.getContext('2d', {willReadFrequently:true});
  if (!ctx) return null;
  samples.forEach((x, column) => ctx.drawImage(image,x,0,1,height,column,0,1,height));
  const pixels = ctx.getImageData(0,0,samples.length,height).data;
  canvas.width = canvas.height = 1;

  function colorAt(y, r, g, b) {
    return samples.every((_, column) => {
      const i = (y * samples.length + column) * 4;
      return pixels[i] === r && pixels[i + 1] === g && pixels[i + 2] === b;
    });
  }

  const end = height - 164;
  if (!colorAt(end + 30, 241,243,243)) return null;
  let start = 0;
  let tealRun = 0;
  for (let y = 0; y < end; y++) {
    if (colorAt(y,33,82,88)) {
      tealRun++;
    } else {
      if (tealRun === 60) start = y;
      tealRun = 0;
    }
  }
  if (!start) return null;
  // The closing rule is part of the footer so it stays below the final account row.
  const closingRule = end - 2;
  const boundaries = [start];
  for (let y = start; y < closingRule - 1; y++) {
    if (colorAt(y,235,239,239) && !colorAt(y + 1,235,239,239)) boundaries.push(y + 1);
  }
  boundaries.push(closingRule);
  if (boundaries.length !== count + 1) return null;
  return boundaries.slice(0,-1).map((y,index) => ({top:y,bottom:boundaries[index+1]}));
}

function sourceOf(entry) {
  const matched = /^https:\/\/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]{15,100})(?:\/view)?(?:\?[A-Za-z0-9_=&%-]+)?$/.exec(entry.source);
  return matched ? {url:entry.source,id:matched[1]} : null;
}

function selectPhoto(source, trigger) {
  returnTarget = trigger;
  returnScroll = window.scrollY;
  notice.hidden = true;
  photo.hidden = false;
  const status = byId('photo-status');
  status.textContent = '사진을 불러오는 중입니다.';
  status.hidden = false;
  back.focus({preventScroll:true});
  window.scrollTo(0,0);

  const image = document.createElement('img');
  image.alt = '이 적발경위의 원본 사진 미리보기';
  image.decoding = 'async';
  image.hidden = true;
  const size = innerWidth <= 550 ? 'w640' : 'w900';
  const preview = new URL('https://lh3.googleusercontent.com/d/' + source.id + '=' + size);
  const fallback = new URL('https://drive.google.com/thumbnail');
  fallback.search = new URLSearchParams({id:source.id,sz:size});
  const key = new URL(source.url).searchParams.get('resourcekey');
  if (key) {
    preview.searchParams.set('resourcekey',key);
    fallback.searchParams.set('resourcekey',key);
  }
  image.addEventListener('load', () => {
    if (!image.isConnected) return;
    status.hidden = true;
    image.hidden = false;
  }, {once:true});
  image.addEventListener('error', () => {
    if (!image.isConnected) return;
    if (image.src === preview.href) {
      image.src = fallback.href;
      return;
    }
    status.textContent = '사진을 불러오지 못했습니다. 고지서로 돌아가 다시 선택해 주세요.';
  });
  photoBody.replaceChildren(image);
  image.src = preview.href;
}

function returnToNotice() {
  if (photo.hidden) return;
  photo.hidden = true;
  photoBody.replaceChildren();
  notice.hidden = false;
  window.scrollTo(0,returnScroll);
  returnTarget?.focus({preventScroll:true});
}

function showSourceList(entries) {
  const links = byId('other-links');
  entries.forEach(entry => {
    const source = sourceOf(entry);
    if (!source) return;
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = [entry.violationAt,entry.violation].filter(Boolean).join(' · ') || '사진 보기';
    button.addEventListener('click', () => selectPhoto(source,button));
    const row = document.createElement('li');
    row.appendChild(button);
    links.appendChild(row);
  });
  byId('other-photos').hidden = !links.children.length;
}

function orderNotices(entries) {
  return entries.slice().sort((a,b) =>
    a.dueDate.localeCompare(b.dueDate) || b.amount-a.amount || a.violationAt.localeCompare(b.violationAt));
}

function photoButton(entry) {
  const source = sourceOf(entry);
  if (!source) return null;
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'photo-hit';
  button.setAttribute('aria-label','적발경위 '+(entry.violation || '')+' 사진 보기');
  const label = document.createElement('span');
  label.className = 'photo-label';
  label.textContent = '[사진보기]';
  button.appendChild(label);
  button.addEventListener('click', () => selectPhoto(source,button));
  return button;
}

function accountBand(entry) {
  const block = document.createElement('div');
  block.className = 'account-band';
  const heading = document.createElement('strong');
  heading.textContent = '납부계좌';
  block.appendChild(heading);
  const accounts = !entry.overdue && entry.dueDate && Array.isArray(entry.accounts) ? entry.accounts.slice(0,3) : [];
  if (accounts.length) {
    const list = document.createElement('ul');
    accounts.forEach(account => {
      const number = document.createElement('li');
      number.textContent = account;
      list.appendChild(number);
    });
    block.appendChild(list);
  } else {
    const status = document.createElement('p');
    status.textContent = entry.overdue ? '기한 경과 · 최신 금액·계좌 확인 필요' : '계좌 정보 확인 필요';
    if (entry.overdue) status.className = 'account-hidden';
    block.appendChild(status);
  }
  return block;
}

function noticeSlice(top,bottom) {
  const slice = document.createElement('div');
  const height = bottom - top;
  slice.className = 'notice-slice';
  slice.style.setProperty('--slice-aspect',png.naturalWidth+' / '+height);
  slice.style.setProperty('--slice-scale',(png.naturalHeight / height * 100)+'%');
  slice.style.setProperty('--slice-offset',(top / (png.naturalHeight - height) * 100)+'%');
  return slice;
}

function displayNotice(entries) {
  const rows = archivedRows(png,entries.length);
  const key = entry => JSON.stringify([entry.dueDate,entry.amount,entry.violationAt]);
  const ambiguous = entries.some((entry,index) => index > 0 &&
    key(entry) === key(entries[index-1]) && entry.source !== entries[index-1].source);
  if (!rows || ambiguous) {
    showSourceList(entries);
    const accounts = byId('account-fallback');
    entries.forEach(entry => {
      const block = accountBand(entry);
      const date = document.createElement('h3');
      date.className = 'account-context';
      date.textContent = entry.violationAt || entry.violation || '고지 내역';
      block.prepend(date);
      accounts.appendChild(block);
    });
    accounts.hidden = false;
    return;
  }

  // Each slice uses the same decoded PNG, so attaching rows adds no image requests.
  paper.style.setProperty('--notice-image','url("'+png.src+'")');
  const bands = document.createDocumentFragment();
  bands.appendChild(noticeSlice(0,rows[0].top));
  entries.forEach((entry,index) => {
    const row = rows[index];
    const group = document.createElement('section');
    group.className = 'notice-entry';
    group.setAttribute('aria-label',[entry.violationAt,entry.violation].filter(Boolean).join(' · ') || '고지 내역');
    const detail = noticeSlice(row.top,row.bottom);
    const button = photoButton(entry);
    if (button) detail.appendChild(button);
    const account = document.createElement('div');
    account.className = 'account-row';
    account.appendChild(accountBand(entry));
    group.append(detail,account);
    bands.appendChild(group);
  });
  bands.appendChild(noticeSlice(rows.at(-1).bottom,png.naturalHeight));
  png.hidden = true;
  paper.appendChild(bands);
}

async function load() {
  const input = new URLSearchParams(location.hash.slice(1));
  const row = input.get('row') || '';
  const token = input.get('t') || '';
  const status = byId('status');
  byId('retry').hidden = true;
  if (!/^[1-9][0-9]{0,6}$/.test(row) || Number(row) < 2 || !/^[a-f0-9]{64}$/.test(token)) {
    status.textContent = '차량 고지서 주소를 확인해 주세요.';
    return;
  }
  status.textContent = '고지서를 불러오는 중입니다.';
  const endpoint = new URL(service);
  endpoint.search = new URLSearchParams({format:'notice-data',row,t:token});
  try {
    const response = await fetch(endpoint,{
      credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(15000)
    });
    if (!response.ok) throw new Error('request');
    const payload = await response.json();
    if (payload.status === 'unavailable') {
      status.textContent = '열 수 없는 고지서입니다. 담당자에게 고지서 주소를 다시 요청해 주세요.';
      return;
    }
    if (payload.status !== 'ok' || !Array.isArray(payload.notices) || !payload.notices.length ||
        !/^data:image\/png;base64,iVBORw0KGgo[A-Za-z0-9+/]+={0,2}$/.test(payload.png)) throw new Error('no notice');
    png.src = payload.png;
    await png.decode();
    png.alt = payload.vehicle + ' 차량별 과태료 고지서';
    notice.setAttribute('aria-label',png.alt);
    displayNotice(orderNotices(payload.notices));
    byId('loading').hidden = true;
    notice.hidden = false;
  } catch {
    status.textContent = '고지서를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';
    byId('loading').hidden = false;
    byId('retry').hidden = false;
  }
}
back.addEventListener('click',returnToNotice);
document.addEventListener('keydown',event=>{if(event.key==='Escape')returnToNotice();});
byId('retry').addEventListener('click',load);
load();
</script>
</body>
</html>
